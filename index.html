    // 6. Setup Route Line and Waypoint layers
    const namedWaypoints = {
      "type": "FeatureCollection",
      "features": rawGeoJSON.features.filter(f => f.geometry.type === "Point" && f.properties && f.properties.label)
    };
    const waypointsLayer = L.geoJSON(namedWaypoints, {
      pointToLayer: function(feature, latlng) {
        return L.circleMarker(latlng, {
           radius: 5,
           fillColor: "#ef4444",
           color: "#ffffff",
           weight: 2,
           fillOpacity: 0.95
         });
      },
      onEachFeature: function(feature, layer) {
        layer.bindPopup(`
          <div class="p-1 font-sans">
            <span class="text-xs uppercase tracking-wider text-slate-400 font-semibold block">Waypoint</span>
            <strong class="text-slate-100 text-sm font-medium">${feature.properties.label}</strong>
          </div>
        `);
      }
    });

    const routeLineCoords = rawGeoJSON.features
      .filter(f => f.geometry.type === "LineString")
      .map(f => f.geometry.coordinates);
    const routeLinesLayer = L.geoJSON({
      "type": "Feature",
      "geometry": { "type": "MultiLineString", "coordinates": routeLineCoords }
    }, {
      style: {
         color: "#38bdf8",
         weight: 3,
         opacity: 0.85,
        dashArray: "4, 6"
      }
    });
    const routeGroup = L.layerGroup([routeLinesLayer, waypointsLayer]).addTo(map);

    // 7. Dynamic Fetching & High-Precision Spatial Merging of 1955 Borders (Colorful Map / Blue Legend)
    fetch('https://raw.githubusercontent.com/nvkelso/natural-earth-vector/master/geojson/ne_50m_admin_0_countries.geojson')
      .then(response => {
        if (!response.ok) throw new Error("Network error loading boundary data.");
        return response.json();
      })
      .then(globalGeoJSON => {
        const features1955 = [];
        
        // --- A. DISSOLVE/MERGE YUGOSLAVIA ---
        const yugoslaviaConstituents = [
          "Slovenia", "Croatia", "Bosnia and Herzegovina", "Bosnia and Herz.", 
          "Serbia", "Montenegro", "North Macedonia", "Kosovo"
        ];
        
        const yugoFeatures = globalGeoJSON.features.filter(f => {
          const name = f.properties.NAME || f.properties.ADMIN;
          return yugoslaviaConstituents.includes(name);
        });

        if (yugoFeatures.length > 0) {
          try {
            let validFeatures = yugoFeatures.map(f => turf.cleanCoords(f));
            let mergedYugo = validFeatures[0];
            for (let i = 1; i < validFeatures.length; i++) {
              try {
                const unioned = turf.union(mergedYugo, validFeatures[i]);
                if (unioned) mergedYugo = unioned;
              } catch (innerErr) {
                console.warn("Skipping faulty union geometry for constituent", innerErr);
              }
            }
            mergedYugo.properties = { historicName: "FPR Yugoslavia" };
            features1955.push(mergedYugo);
          } catch (e) {
            console.warn("Turf union fallback for Yugoslavia", e);
            features1955.push({
              type: "Feature",
              properties: { historicName: "FPR Yugoslavia" },
              geometry: { type: "GeometryCollection", geometries: yugoFeatures.map(f => f.geometry) }
            });
          }
        }

        // --- B. RETAINED METADATA MAPPING ---
        const standardCountryMapping = {
          "Italy": "Italy",
          "France": "France",
          "Switzerland": "Switzerland",
          "Austria": "Austria",
          "Albania": "Albania"
        };

        globalGeoJSON.features.forEach(f => {
          const name = f.properties.NAME || f.properties.ADMIN;
          const mappedHistoricName = standardCountryMapping[name];
          if (mappedHistoricName) {
            if (!features1955.some(alreadyAdded => alreadyAdded.properties.historicName === mappedHistoricName)) {
              f.properties.historicName = mappedHistoricName;
              features1955.push(f);
            }
          }
        });

        // --- C. RENDER HISTORICAL BORDERS LAYER ---
        const historicalBordersGeoJSON = {
          type: "FeatureCollection",
          features: features1955
        };

        const renderLayer = L.geoJSON(historicalBordersGeoJSON, {
          style: function(feature) {
            const historicKey = feature.properties.historicName;
            const meta = historicalMetadata[historicKey] || {};
            return {
              color: meta.color || "#ca8a04",
              weight: 2.2,
              opacity: 0.9,
              fillColor: meta.color || "#eab308",
              fillOpacity: 0.28
            };
          },
          onEachFeature: function(feature, layer) {
            const historicKey = feature.properties.historicName;
            const meta = historicalMetadata[historicKey];
            if (meta) {
              const popupHtml = `
                <div class="p-2 font-sans max-w-xs">
                  <div class="flex items-center space-x-2 mb-1.5 border-b border-slate-700/60 pb-2">
                    <span class="w-3 h-3 rounded-full inline-block" style="background-color: ${meta.color}"></span>
                    <h3 class="font-bold text-base text-slate-100">${meta.name}</h3>
                  </div>
                  <p class="text-xs text-slate-300 mb-1"><strong>Official Name:</strong> ${meta.fullName}</p>
                  <p class="text-xs text-slate-300 mb-2"><strong>Capital:</strong> ${meta.capital}</p>
                  <div class="bg-slate-900/60 p-2 rounded border border-slate-700/40 text-[11px] text-slate-300 leading-relaxed">
                    ${meta.history}
                  </div>
                </div>
              `;
              layer.bindPopup(popupHtml);
              layer.on({
                mouseover: (e) => {
                  const targetLayer = e.target;
                  targetLayer.setStyle({
                    fillOpacity: 0.5,
                    weight: 3.5,
                    opacity: 1
                  });
                  targetLayer.bringToFront();
                  if (typeof routeGroup !== 'undefined' && routeGroup) {
                    routeGroup.bringToFront();
                  }
                  targetLayer.bindTooltip(meta.name, {
                    direction: 'top',
                    sticky: true,
                    className: 'country-hover-tooltip'
                  }).openTooltip();
                },
                mouseout: (e) => {
                  renderLayer.resetStyle(e.target);
                  e.target.closeTooltip();
                }
              });
            }
          }
        });
        renderLayer.addTo(historicalBordersLayerGroup);
        
        const loader = document.getElementById('loading-screen');
        if (loader) {
          loader.style.opacity = '0';
          setTimeout(() => loader.remove(), 400);
        }
      })
      .catch(error => {
        console.error("Error generating 1955 historical boundaries:", error);
        const loader = document.getElementById('loading-screen');
        if (loader) {
          loader.innerHTML = `
            <div class="bg-red-950/80 p-6 rounded-xl border border-red-800 text-red-200">
              <h3 class="font-bold mb-2 text-base">Failed to load boundary datasets</h3>
              <p class="text-xs">Please check your internet connection and refresh the page.</p>
            </div>
          `;
        }
      });

    // 8. Add Layer Controls (with blue legends)
    const overlayMaps = {
      "<span class='text-blue-400 font-semibold text-xs'>1955 Historical Borders</span>": historicalBordersLayerGroup,
      "<span class='text-blue-400 font-semibold text-xs'>Travel Route & Waypoints</span>": routeGroup
    };
    L.control.layers(null, overlayMaps, { 
       position: 'topright', 
       collapsed: false 
    }).addTo(map);

    // 9. Auto-fit bounds to route
    const bounds = routeLinesLayer.getBounds().extend(waypointsLayer.getBounds());
    if (bounds.isValid()) {
      map.fitBounds(bounds, { padding: [40, 40] });
    }
  </script>
</body>
</html>
